<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Carrito - Carrito</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>

    <img src="ELCARRITO.png" alt="Imagen carrito" width="300">

    <h1>Tienda Carrito</h1>
    <p>Carrito de compra</p>

     <nav>
      <a href="index.html">Inicio</a> |
      <a href="productos.html">Productos</a> |
      <a href="contacto.html">Contacto</a> |
      <a id="link-sesion" href="login.html">Iniciar sesión</a>
    </nav>

  </header>

  <main>

    <section>
    <h2>Resumen del carrito</h2>

    <p id="datos-carrito"></p>

    <table border="1">
      <caption>Productos añadidos</caption>

      <thead>
        <tr>
          <th>ID Artículo</th>
          <th>Unidades</th>
          <th>Precio unitario</th>
          <th>Precio final</th>
          <th>Quitar producto</th>
        </tr>
      </thead>

      <tbody id="tabla-lineas-carrito"></tbody>
    </table>

    <p id="mensaje-carrito"></p>

    <button id="btn-borrar-carrito">Borrar carrito completo</button>
    <button id="btn-cerrar-sesion">Cerrar sesión</button>
  </section>

  </main>

  <footer>
     <p>© 2026 Isabel Alonso Casas - Práctica 5 </p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
